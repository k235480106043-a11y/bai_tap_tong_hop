<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - NgocLinh</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #eef2f5; margin: 0; padding: 40px; }
        .container { max-width: 600px; background: #fff; margin: 0 auto; border-radius: 12px; padding: 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        h2 { color: #1a252f; text-align: center; margin-bottom: 5px; }
        .author { text-align: center; font-weight: 600; color: #0066cc; margin-bottom: 25px; }
        .btn-call { display: block; width: 100%; padding: 14px; background: #28a745; color: #fff; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-call:hover { background: #218838; }
        .result-box { margin-top: 20px; background: #f8f9fa; border: 1px solid #e9ecef; border-radius: 8px; padding: 15px; }
        .item { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #ddd; }
        .item:last-child { border-bottom: none; }
    </style>
</head>
<body>
    <div class="container">
        <h2>HỆ THỐNG QUẢN LÝ DỮ LIỆU</h2>
        <div class="author">Thực hiện: Nguyễn Thị Ngọc Linh</div>
        <button class="btn-call" onclick="loadData()">Tải dữ liệu từ API Node-RED</button>
        <div id="status" style="margin-top: 15px; text-align: center; color: #6c757d;"></div>
        <div id="result" class="result-box" style="display:none;"></div>
    </div>
    <script src="app_main.js"></script>
</body>
</html>
